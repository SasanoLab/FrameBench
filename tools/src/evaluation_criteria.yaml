evaluation_criteria:
  - name: "回答"
    description: "文末に登場する動詞に着目して回答してください"
    # 問題形式ごとに異なる選択肢を定義
    scale:
      four_choices:
        1: "Sentence 1"
        2: "Sentence 2"
        3: "どちらも当てはまる"
        4: "どちらも当てはまらない"
      two_choices:
        1: "Sentence 1"
        2: "Sentence 2"
      single:
        1: "Yes"
        2: "No"

  - name: "日本語の品質"
    description: ""
    scale:
      four_choices:
        1: "自然"
        2: "不自然"
      two_choices:
        1: "自然"
        2: "不自然"
      single:
        1: "自然"
        2: "不自然"
    
