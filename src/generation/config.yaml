# LLMモデル設定ファイル
models:
  gpt-5:
    provider: openai
    class: ChatOpenAI
    reasoning: medium
    default_params:
      model: gpt-5-2025-08-07
      temperature: 1.0
      max_output_tokens: 4000
    
  gpt-5.2:
    provider: openai
    class: ChatOpenAI
    reasoning: medium
    default_params:
      model: gpt-5.2-2025-12-11
      temperature: 1.0
      max_output_tokens: 4000
    
  gpt-5.1:
    provider: openai
    class: ChatOpenAI
    reasoning: medium
    default_params:
      model: gpt-5.1-2025-11-13
      temperature: 1.0
      max_output_tokens: 4000
    
  gpt-5-mini:
    provider: openai
    class: ChatOpenAI
    reasoning: medium
    default_params:
      model: gpt-5-mini-2025-08-07
      temperature: 1.0
      max_output_tokens: 4000
    
  gpt-5-nano:
    provider: openai
    class: ChatOpenAI
    reasoning: medium
    default_params:
      model: gpt-5-nano-2025-08-07
      temperature: 1.0
      max_output_tokens: 4000
    
  gpt-4.1:
    provider: openai
    class: ChatOpenAI
    reasoning: none
    default_params:
      model: gpt-4.1-2025-04-14
      temperature: 0.7
      max_output_tokens: 4000
    
  gpt-4.1-mini:
    provider: openai
    class: ChatOpenAI  
    reasoning: none
    default_params:
      model: gpt-4.1-mini-2025-04-14
      temperature: 0.7
      max_output_tokens: 4000

  gemini-3.1-pro-preview:
    provider: openai
    class: ChatOpenAI
    api_type: chat_completions
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GOOGLE_API_KEY"
    reasoning: medium
    concurrency: 1
    default_params:
      model: gemini-3.1-pro-preview
      temperature: 1.0
      reasoning_effort: medium