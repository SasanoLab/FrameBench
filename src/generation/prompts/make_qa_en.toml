version = "v0.19.0"
engine = "jinja2" # template engine for variable interpolation
language = "en"

[engine_options]
undefined = "debug"

# Below are the actual instructions sent to the LLM
# Structured to align with common OpenAI chat formats
[[messages]]
role = "system"
content = '''
You analyze text and output results strictly in JSON format.
Follow these rules rigorously:
- The output MUST be a JSON object.
- All JSON keys and string values MUST be wrapped in double quotes "."
'''

[[messages]]
role = "user"
content = '''
Please fully comply with the following [Input Data] and [Creation Instructions], and generate {{ n }} sets of English sentence pairs and quizzes.

[Input Data]

Verb to use: {{ verb }}

Frame A information: {{ definitions_a }}

Frame B information: {{ definitions_b }}

[Creation Instructions]

Step 0: Discover the Most Interesting "Essential Difference" First, compare and analyze Frame A and Frame B given in the [Input Data]. Identify exactly one point that is implicit (not written explicitly in the sentences) yet essential, which produces the core difference between the frames. Use this as the basis for all subsequent steps.

Step 1: Create Example Sentences Using the "Verb to use," create Sentence 1 for Frame A and Sentence 2 for Frame B. Ensure each sentence reliably evokes its intended frame. Reference sentences that evoke the frame can be helpful. Since the subsequent step will ask about the essential difference identified in Step 0, craft sentences that implicitly reflect that difference.

Rule (a): Do NOT include hints to the answer in the sentences.
    Avoid overt words that would directly reveal the later question's "answer."
Rule (b): Make the two sentences as similar as reasonably possible in content words (excluding the verb), so that comparison is meaningful.
    However, do not make them so similar that they fail to evoke different frames.
Rule (c) (most important): The sentences must be natural English. Ensure other rules do not produce awkward English.

Step 2: Create the Question Create a simple quiz question, in specific and plain wording, that asks about the "essential difference" you found in Step 0.

**Refine for engagement:** Start by identifying the factual difference. Then, **phrase it as a "Condition" describing an interesting situation, consequence, or reaction**.

**Format Constraint:** To ensure the [Condition] is reusable for various question types (like "Select all where..."), you **MUST** follow this structure:
1.  Create a **[Condition]** phrase as a **Declarative Clause (Subject + Verb...)**.
    * *Bad (Inverted/Question form):* "is he angry", "did he lose money"
    * *Good (Declarative form):* "he is angry", "he lost money"
2.  Form the final question using the pattern:
    **"Which sentence implies that [Condition]?"**

**CRITICAL CONSTRAINT on Content:**
- **Use "Single-Point Focus":** The [Condition] must describe the presence of ONE specific trait in a straightforward manner.
- **NO Comparisons/Negations:** **Strictly AVOID** comparative or negative phrasing in the condition.
    - Bad: "...implies that the action is intentional *rather than* accidental"
    - Bad: "...implies that the user is *not* happy"
    - Good: "...implies that the user likely planned the action beforehand"

Prohibitions: Do NOT use the following in the question.
    - Technical terms (e.g., frame names, core element names)
    - Vague words (e.g., nuance, intention, feeling)
    - Simple paraphrases of the exact words used in the example sentences
Ensure the answer deterministically picks exactly one of the two sentences. If not, adjust sentences or the question while respecting Steps 1 and 2.

[Checks] Consider the following before finalizing:
- Are the sentences natural English with clear meanings?
- Is the [Condition] a declarative clause (Subject+Verb) and NOT a question form?
- Does "Which sentence implies that [Condition]?" sound natural?
- Can the answer be found without merely spotting a specific word in either sentence?


Output must be in the following JSON format, and output nothing else.
```json
{
  "results": [
    {
      "thinking_process": "Analysis of frame differences and strategy",
      "sentence_pair": {
        "{{ frame_a }}": "Sentence corresponding to Frame A",
        "{{ frame_b }}": "Sentence corresponding to Frame B"
      },
      "qa": {
        "condition_phrase": "String (Must be a Declarative Clause, e.g., 'the user is angry')",
        "question": "String (Full question: 'Which sentence implies that [condition_phrase]?')",
        "choices": ["Sentence 1", "Sentence 2"],
        "answer": "String (Must match one of the choices exactly)"
      }
    },
  ]
}
```

IMPORTANT: You MUST output exactly the JSON above, with no extra text.
'''
