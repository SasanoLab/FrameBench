# プロンプトのバージョンや設定を記述
version = "v0.19.0_nothink"
engine = "jinja2" # 変数を埋め込むためのテンプレートエンジンを指定

[engine_options]
undefined = "debug"

# ここから下が、LLMに渡す実際の指示
# OpenAIのAPIなどで使われる形式に合わせています
[[messages]]
role = "system"
content = '''
あなたはテキストを分析し、結果をJSON形式で出力するアシスタントです。
以下のルールを**厳密に**守ってください。
- 出力は必ずJSONオブジェクト形式とすること。
- JSONのキーと文字列の値は、すべてダブルクォーテーション `"` で囲むこと。
'''

[[messages]]
role = "user"
content = '''
以下の【入力データ】と【作成指示】を完全に遵守し、日本語の文ペアとクイズのセットを{{ n }}個作成してください。

【入力データ】

使用する述語動詞:{{ verb }}

フレームAの情報:{{ definitions_a }}

フレームBの情報:{{ definitions_b }}

【作成指示】
ステップ1：例文の作成
    【入力データ】の「使用する述語動詞」を使い、フレームAの文1とフレームBの文2を作成してください。
    それぞれの文が**必ず該当のフレームを喚起するよう**、注意して例文を作成してください。その際、フレームを喚起する例文は大変参考になるはずです。

    ルール(a): 答えのヒントを文中に含めないこと。
        例文を作成する際、後で作る質問の「答え」そのものを示すような、あからさまな単語を意図的に避けてください。
        （悪い例： もし質問が「物理的な移動」の有無を問うものなら、例文中に「彼は移動するために家を出た」のような、答えを直接示す言葉を入れてはいけません。）
    ルール(b): 2つの文は、動詞以外の内容語を可能な限り似せて、比較が意味を持つようにしてください。
      ただし、あまりにも似すぎるとそれぞれの文が違うフレームを喚起していることがわからなくなるので注意してください。助詞を変更するだけなどはやめてください。
    ルール(c): フレームを喚起する動詞は完了形で、文末に置かなければなりません。
    （最重要）ルール(d): 例文は、自然な日本語にしてください。特にその他のルールを守ることで変な日本語になっていないか注意してください。

ステップ2：質問の作成
    例文が持つフレーム間の違いについて、**具体的かつ平易な言葉で尋ねるシンプルなクイズ**を作成してください。
    回答者がフレームについて聞かれているとわからないほど、よくあるクイズのようにしてください。シンプルすぎると2文とも答えになってしまう場合があるので、気をつけてください。
    以下のように、自然で面白いクイズのような質問文にすることを心がけてください。「〜のはどちらの文ですか？」という形式で作問すると、文法の破綻を防げます。
        例) 彼女が一人でいるのはどちらの文ですか？, 値が増加しているのはどちらの文ですか？, 彼が動作しているのはどちらの文ですか？

    禁止事項: 質問文には、以下の言葉を絶対に使用しないでください。
        - 専門用語（フレーム名、コア要素名など）
        - 曖昧な言葉（ニュアンス、意図、感じなど）
        - 例文中の言葉の単なる言い換え
    
    答えが必ずどちらかの文に定まるように、ステップ1で作成した例文を見直しながら考えてください。
    答えが両方の文になってしまう場合は、例文や質問を修正して構いませんが、それぞれステップ1と2での指示に従ってください。
    
【注意事項】
以下の事項に注意して、生成を行ってください。
- 作成した例文と質問は、それぞれ日本語として自然で、意味が明確に伝わるか？
- 質問は、真に「暗黙的」でフレームの違いを捉えた内容を問う面白いものになっているか？
- 質問の答えが、例文中の特定の単語や句を見つけるだけで分かってしまうようなものではないか？

良い問題の例）
- フレーム間のコア要素の違いを捉えた問題
    質問：彼に競争相手がいるのはどちらの文ですか？
    文１：彼は金メダルをレストランで失った。
    文２：彼は金メダルを0.2ポイント差で失った。

出力は以下のjson形式にし、他には何も出力しないでください。jsonのkeyとvalueは」などで終わらせず、"で囲んでください。

```json
{
  "results": [
    {
      "sentence_pair": {
        "{{ frame_a }}": "フレームAに対応する文",
        "{{ frame_b }}": "フレームBに対応する文"
      },
      "qa": {
        "question": "生成された質問",
        "choices": ["Sentence 1", "Sentence 2", "Both sentences", "Neither sentence"],
        "answer": "正解の選択肢"
      }
    },
    …
  ]
}
```

**重要**: 必ず上記のJSON形式で出力し、JSON以外のテキストは一切含めないでください。
'''

