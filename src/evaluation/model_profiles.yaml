# 評価用モデルプロファイル
# モデル名はプレフィックス一致で検索されます（例: "gpt-5.1-2025-04-14" は "gpt-5.1" にマッチ）
# 新しいモデルを追加する際はここに追記してください
#
# 利用可能なフィールド:
#   backend: "openai" | "vllm" - 使用するバックエンド（必須）
#   base_url: OpenAI互換APIのエンドポイントURL（省略時はOpenAI公式エンドポイント）
#             例: "https://generativelanguage.googleapis.com/v1beta/openai/"  # Gemini
#                 "https://api.anthropic.com/v1/"                             # Anthropic
#   api_key_env: APIキーを格納する環境変数名（省略時: "OPENAI_API_KEY"）
#                例: "GOOGLE_API_KEY", "ANTHROPIC_API_KEY"
#   reasoning_effort: リスト形式で対応するreasoning_effortレベルを指定（thinking対応モデル）
#   supports_thinking: false - thinkingに対応していない場合は明示的に指定
#   thinking_stop: thinkingモードの停止文字列（vLLMのみ、デフォルト: "</think>"）
#   trust_remote_code: true - カスタムモデルコードを使用する場合に必要（vLLMのみ）
#   structured_outputs: true/false - 構造化出力（JSON schema）をサポートするか（OpenAI互換APIのみ）
#                       false の場合はテキスト出力から選択肢をパースする

# vLLM共通デフォルトサンプリングパラメータ
vllm_defaults:
  # thinkタグの終了文字列（生成のstopとレスポンス解析の両方に使われる）
  thinking_stop: "</think>"
  # thinkingモード（thinking + 回答フェーズ共通）のサンプリング設定
  thinking_sampling:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
  # 通常モード（thinking無効）のサンプリング設定
  sampling:
    temperature: 0.7
    top_p: 0.8
    top_k: 20

# モデル別プロファイル
models:

  # ===== OpenAI =====
  # APIキー: OPENAI_API_KEY 環境変数

  gpt-5.1:
    backend: openai
    reasoning_effort: [none, minimal, low, medium, high]
    structured_outputs: true

  gpt-5:
    backend: openai
    reasoning_effort: [minimal, low, medium, high]
    structured_outputs: true

  gpt-5-nano:
    backend: openai
    reasoning_effort: [minimal, low, medium, high]
    structured_outputs: true

  # ===== Google Gemini =====
  # APIキー: GOOGLE_API_KEY 環境変数
  # OpenAI互換エンドポイント経由でアクセス
  # 参考: https://ai.google.dev/gemini-api/docs/openai

  gemini-3.1-pro-preview:
    backend: openai
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GOOGLE_API_KEY"
    reasoning_effort: [low, medium, high]
    structured_outputs: true

  gemini-3-flash-preview:
    backend: openai
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GOOGLE_API_KEY"
    reasoning_effort: [low, medium, high]
    structured_outputs: true

  gemini-3.1-flash-lite-preview:
    backend: openai
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GOOGLE_API_KEY"
    reasoning_effort: [low, medium, high]
    structured_outputs: true

  # ===== vLLM =====

  openai/gpt-oss-20b:
    backend: vllm
    reasoning_effort: [low, medium, high]
    thinking_stop: "assistantfinal"
  openai/gpt-oss-120b:
    backend: vllm
    reasoning_effort: [low, medium, high]
    thinking_stop: "assistantfinal"

  # Qwen3シリーズ
  Qwen/Qwen3-0.6B:
    backend: vllm
    supports_thinking: true
  Qwen/Qwen3-1.7B:
    backend: vllm
    supports_thinking: true
  Qwen/Qwen3-4B:
    backend: vllm
    supports_thinking: true
  Qwen/Qwen3-32B:
    backend: vllm
    supports_thinking: true

  # Qwen3.5シリーズ 
  #TODO: --language-model-onlyオプションを付けたほうがいいかも
  Qwen/Qwen3.5-0.8B:
    backend: vllm
    supports_thinking: true
  Qwen/Qwen3.5-2B:
    backend: vllm
    supports_thinking: true
  Qwen/Qwen3.5-4B:
    backend: vllm
    supports_thinking: true
  Qwen/Qwen3.5-9B:
    backend: vllm
    supports_thinking: true
  Qwen/Qwen3.5-27B:
    backend: vllm
    supports_thinking: true
  Qwen/Qwen3.5-35B-A3B:
    backend: vllm
    supports_thinking: true

  # Google Gemma3シリーズ
  google/gemma-3-1b-it:
    backend: vllm
    supports_thinking: false
  google/gemma-3-4b-it:
    backend: vllm
    supports_thinking: false
  google/gemma-3-12b-it:
    backend: vllm
    supports_thinking: false
  google/gemma-3-27b-it:
    backend: vllm
    supports_thinking: false

  # Google Gemma4シリーズ
  # <channel|> は特殊トークンのため skip_special_tokens=False が必要
  google/gemma-4-E2B-it:
    backend: vllm
    supports_thinking: true
    thinking_stop: "<channel|>"
    skip_special_tokens: false
    trust_remote_code: true
  google/gemma-4-E4B-it:
    backend: vllm
    supports_thinking: true
    thinking_stop: "<channel|>"
    skip_special_tokens: false
    trust_remote_code: true
  google/gemma-4-26B-A4B-it:
    backend: vllm
    supports_thinking: true
    thinking_stop: "<channel|>"
    skip_special_tokens: false
    trust_remote_code: true
  google/gemma-4-31B-it:
    backend: vllm
    supports_thinking: true
    thinking_stop: "<channel|>"
    skip_special_tokens: false
    trust_remote_code: true 

  llm-jp/llm-jp-4-8b-thinking:
    backend: vllm
    supports_thinking: true
    reasoning_effort: [low, medium, high]
    thinking_stop: " assistant final "
    trust_remote_code: true
  llm-jp/llm-jp-4-32b-a3bthinking:
    backend: vllm
    supports_thinking: true
    reasoning_effort: [low, medium, high]
    thinking_stop: " assistant final "
    trust_remote_code: true

  tokyotech-llm/Qwen3-Swallow-8B-RL-v0.2:
    backend: vllm
    supports_thinking: true
    thinking_stop: "</think>"
  tokyotech-llm/Qwen3-Swallow-32B-RL-v0.2:
    backend: vllm
    supports_thinking: true
    thinking_stop: "</think>"