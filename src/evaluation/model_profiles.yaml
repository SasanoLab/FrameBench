# 評価用モデルプロファイル
# モデル名はプレフィックス一致で検索されます（例: "gpt-5.1-2025-04-14" は "gpt-5.1" にマッチ）
# 新しいモデルを追加する際はここに追記してください
#
# 利用可能なフィールド:
#   backend: "openai" | "vllm" - 使用するバックエンド（必須）
#   base_url: OpenAI互換APIのエンドポイントURL（省略時はOpenAI公式エンドポイント）
#             例: "https://generativelanguage.googleapis.com/v1beta/openai/"  # Gemini
#                 "https://api.anthropic.com/v1/"                             # Anthropic
#   api_key_env: APIキーを格納する環境変数名（省略時: "OPENAI_API_KEY"）
#                例: "GOOGLE_API_KEY", "ANTHROPIC_API_KEY"
#   reasoning_effort: リスト形式で対応するreasoning_effortレベルを指定（thinking対応モデル）
#   supports_thinking: false - thinkingに対応していない場合は明示的に指定
#   supports_multimodal: true - 画像などのマルチモーダル入力に対応する場合は明示
#   thinking_stop: thinkingモードの停止文字列（vLLMのみ、デフォルト: "</think>"）
#   thinking_generation_mode: thinking時の生成方式（省略時: two_phase）
#     two_phase   - 思考フェーズを制約なしで生成し、回答フェーズだけ 1/2/3/4 に制約
#     single_json - 1回の生成で思考から {"answer":"N"} JSON まで出力（Harmony系で2フェーズが不安定な場合）
#   no_thinking_generation_prefill: 通常生成時だけチャットテンプレート末尾へ補う文字列（vLLMのみ）
#   single_json_max_tokens: 12288 - single_json 時の max_tokens（モデル別上書き可、省略時は vllm_defaults）
#   trust_remote_code: true - カスタムモデルコードを使用する場合に必要（vLLMのみ）
#   chat_template: tokenizer.chat_template が無いモデルへ渡すJinjaテンプレート（vLLMのみ）
#   message_content_format: "multimodal_list" - content が list[{"type":"text"}] のチャットテンプレート向け
#   structured_outputs: true/false - 構造化出力（JSON schema）をサポートするか（OpenAI互換APIのみ）
#                       false の場合はテキスト出力から選択肢をパースする

# vLLM共通デフォルトサンプリングパラメータ
vllm_defaults:
  # thinkタグの終了文字列（生成のstopとレスポンス解析の両方に使われる）
  thinking_stop: "</think>"
  # thinkingモードの思考フェーズのサンプリング設定
  thinking_sampling:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
  # thinkingモードの回答フェーズのサンプリング設定
  # choice制約の候補数字をtop_k/top_pで落とさないよう、デフォルトでは貪欲に選ぶ
  answer_sampling:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
  # 通常モード（thinking無効）のサンプリング設定
  sampling:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
  # thinking_generation_mode: single_json の max_tokens（思考 + 最終JSON）
  single_json_max_tokens: 12288  # 20b / Swallow 等の既定。120b はモデル別に上書き

# モデル別プロファイル
models:

  # ===== OpenAI =====
  # APIキー: OPENAI_API_KEY 環境変数

  gpt-5.1:
    backend: openai
    reasoning_effort: [none, minimal, low, medium, high]
    supports_multimodal: true
    structured_outputs: true

  gpt-5:
    backend: openai
    reasoning_effort: [minimal, low, medium, high]
    supports_multimodal: true
    structured_outputs: true

  gpt-5-nano:
    backend: openai
    reasoning_effort: [minimal, low, medium, high]
    supports_multimodal: true
    structured_outputs: true

  # ===== Google Gemini =====
  # APIキー: GOOGLE_API_KEY 環境変数
  # OpenAI互換エンドポイント経由でアクセス
  # 参考: https://ai.google.dev/gemini-api/docs/openai

  gemini-3.1-pro-preview:
    backend: openai
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GOOGLE_API_KEY"
    reasoning_effort: [low, medium, high]
    supports_multimodal: true
    structured_outputs: true

  gemini-3-flash-preview:
