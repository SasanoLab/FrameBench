      {% for message in messages %}{% if message['role'] == 'user' %}USER: {{ message['content'] }} {% elif message['role'] == 'assistant' %}ASSISTANT: {{ message['content'] }}{% endif %}{% endfor %}{% if add_generation_prompt %}ASSISTANT:{% endif %}
