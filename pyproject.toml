[project]
name = "generate-frame-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# 評価に必要な最小限の依存関係
dependencies = [
    "pandas>=2.2.3",
    "tqdm>=4.67.1",
    "openai>=1.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    # Langchain dependencies (評価に必要)
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pyyaml>=6.0.2",
    "datasets>=4.5.0",
    "ipywidgets>=8.1.8",
]

[project.optional-dependencies]
# ベンチマーク生成に必要な追加依存関係
generation = [
    "numpy<2.0.0",
    "jinja2>=3.1.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.1.8",
    "nltk>=3.9.1",
]
# vLLMを使用する場合（ローカルLLM評価用）
vllm = [
    "vllm==0.11.0",
    "transformers>=4.52.3",
]
# 開発・可視化ツール
dev = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "requests>=2.31.0",
    "PyJWT>=2.8.0",
    "hf-xet>=1.1.2",
    "logits-processor-zoo>=0.2.1",
]
# すべての依存関係をインストール（generation + vllm + dev）
all = [
    "numpy<2.0.0",
    "jinja2>=3.1.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.1.8",
    "nltk>=3.9.1",
    "vllm==0.11.0",
    "transformers>=4.52.3",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "requests>=2.31.0",
    "PyJWT>=2.8.0",
    "hf-xet>=1.1.2",
    "logits-processor-zoo>=0.2.1",
]
