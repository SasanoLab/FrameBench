# LLMモデル設定ファイル
models:
  gpt-5:
    provider: openai
    class: ChatOpenAI
    reasoning: medium
    default_params:
      model: gpt-5-2025-08-07
      temperature: 1.0
      max_output_tokens: 4000
    
  gpt-5.2:
